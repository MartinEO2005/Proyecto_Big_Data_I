version: '3.8'

services:
  # 1. ETAPA DE DESCARGA
  descarga:
    build:
      context: .
      dockerfile: docker/downloader/Dockerfile
    container_name: etl_descarga
    env_file: .env
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1

  # 2. ETAPA DE LIMPIEZA
  limpieza:
    build:
      context: .
      dockerfile: docker/cleaning/Dockerfile.limpieza
    container_name: etl_limpieza
    depends_on:
      descarga:
        condition: service_completed_successfully
    volumes:
      - .:/app

  # 3. SERVIDOR DE BASE DE DATOS (MySQL)
  mysql_server:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: "%"  # Permite conexiones desde otros contenedores
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Usamos mysqladmin para asegurar que el servidor esté listo para recibir consultas
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 3s
      timeout: 5s
      retries: 15  # Aumenté los reintentos para cubrir el tiempo de inicialización de MySQL

  # 4. ETAPA DE CARGA A MYSQL
  carga_mysql:
    build:
      context: .
      dockerfile: docker/db_loader/Dockerfile.db
    container_name: etl_carga_db
    env_file: .env
    depends_on:
      mysql_server:
        condition: service_healthy
      limpieza:
        condition: service_completed_successfully
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - APP_PROFILE=${APP_PROFILE:-docker}
    # Sobrescribo el comando si es necesario para asegurar que use el host correcto
    command: ["python", "Proyecto/main_dbconnection.py"]

volumes:
  mysql_data: