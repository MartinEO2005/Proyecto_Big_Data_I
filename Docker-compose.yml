version: '3.8'

services:
  # 1. ETAPA DE DESCARGA
  descarga:
    build:
      context: .
      dockerfile: Dockerfile
    # 🔹 ESTA ES LA CLAVE: Inyecta las variables de tu .env al contenedor
    env_file:
      - .env
    volumes:
      - .:/app
    environment:
      # Ayuda a que los logs (como la barra de descarga) se vean al instante
      - PYTHONUNBUFFERED=1

  # 2. ETAPA DE LIMPIEZA
  limpieza:
    build:
      context: .
      dockerfile: Dockerfile.limpieza
    depends_on:
      descarga:
        condition: service_completed_successfully
    volumes:
      - .:/app
  # 3. ETAPA DE BASE DE DATOS
  database:
    build:
      context: .
      dockerfile: Dockerfile.db
    depends_on:
      limpieza:
        condition: service_completed_successfully
    volumes:
      - .:/app