services:
  descarga:
    build:
      context: .
      dockerfile: docker/downloader/Dockerfile
    container_name: etl_descarga
    env_file: .env
    volumes:
      - .:/app
      - ${USERPROFILE}/.config/earthengine:/root/.config/earthengine
    environment:
      - PYTHONUNBUFFERED=1

  limpieza:
    build:
      context: .
      dockerfile: docker/cleaning/Dockerfile.limpieza
    container_name: etl_limpieza
    env_file: .env
    depends_on:
      descarga:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - ${USERPROFILE}/.config/earthengine:/root/.config/earthengine
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python3", "/app/Proyecto/etl/main_limpieza.py"]

  mysql_server:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS}"]
      interval: 3s
      timeout: 5s
      retries: 15

  carga_mysql:
    build:
      context: .
      dockerfile: docker/db_loader/Dockerfile.db
    container_name: etl_carga_db
    env_file: .env
    depends_on:
      mysql_server:
        condition: service_healthy
      limpieza:
        condition: service_completed_successfully
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: ["python", "Proyecto/main_dbconnection.py"]

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=geolumica
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data

  hdfs_init:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hdfs_init
    depends_on:
      namenode:
        condition: service_healthy
      datanode:
        condition: service_healthy
    volumes:
      - .:/app
    entrypoint: /bin/bash
    command: >
      -c "
      set -e &&
      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw &&
      hdfs dfs -mkdir -p hdfs://namenode:9000/data/clean &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/demografia &&
      hdfs dfs -put -f /app/data/demografia/demografia_poblacion_municipios.csv hdfs://namenode:9000/data/raw/demografia/ &&
      hdfs dfs -put -f /app/data/demografia/demografia_poblacion_provincias.csv hdfs://namenode:9000/data/raw/demografia/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/migracion &&
      hdfs dfs -put -f /app/data/migracion/migracion_interior_municipios.csv hdfs://namenode:9000/data/raw/migracion/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/transporte &&
      hdfs dfs -put -f /app/data/transporte/conectividad_municipal_2010_2025.csv hdfs://namenode:9000/data/raw/transporte/ &&
      hdfs dfs -put -f /app/data/transporte/muni_station_metrics_reduced.csv hdfs://namenode:9000/data/raw/transporte/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/empresas_transporte &&
      hdfs dfs -put -f /app/data/empresas_transporte/empresas_transporte_prov_mun_anchos.csv hdfs://namenode:9000/data/raw/empresas_transporte/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/energia &&
      hdfs dfs -put -f /app/data/energia/consumo_electrico.csv hdfs://namenode:9000/data/raw/energia/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/renta &&
      hdfs dfs -put -f /app/data/renta/renta_municipios.csv hdfs://namenode:9000/data/raw/renta/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/luz_nocturna/municipios/luz_nocturna &&
      hdfs dfs -put -f /app/data/luz_nocturna/municipios/luz_nocturna/viirs_luz_nocturna.csv hdfs://namenode:9000/data/raw/luz_nocturna/municipios/luz_nocturna/ &&

      hdfs dfs -mkdir -p hdfs://namenode:9000/data/raw/luz_nocturna/provincias &&
      hdfs dfs -put -f /app/data/luz_nocturna/provincias/viirs_provincias_2018_2022.csv hdfs://namenode:9000/data/raw/luz_nocturna/provincias/
      "
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000

volumes:
  mysql_data:
  namenode_data:
  datanode_data: